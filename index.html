<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毛毛客户资料</title><style>body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:960px;margin:0 auto;padding:32px 18px;color:#2f2925;background:#faf8f5}h1{font-size:28px}article{background:#fff;border:1px solid #e8e0d8;border-radius:12px;padding:20px;margin:16px 0}h2{margin:0 0 12px;font-size:20px}dt{font-weight:700;margin-top:12px;color:#6b5545}dd{margin:4px 0 0;white-space:pre-wrap}a{color:#9b542f}img,video{max-width:100%;max-height:280px;border-radius:8px;margin:8px 8px 0 0}.muted{color:#8a7e75}</style><body><h1>毛毛客户资料</h1><p class="muted">仅展示发布所需资料，参考成片视频不上传。</p><main id="app">正在加载…</main><script>fetch('data.json').then(r=>r.json()).then(({items,skipped})=>{const e=document.getElementById('app');e.replaceChildren(...items.map(item=>{const a=document.createElement('article');a.innerHTML='<h2></h2><dl></dl>';a.querySelector('h2').textContent=item.name;const rows=[['参考成片',item.referenceVideo+'（仅本机参考，不提供视频下载）'],['视频上方标题',item.overlayTitle],['发布标题和话题',item.publishCopy],['领取说明',item.claimText]];const dl=a.querySelector('dl');for(const [k,v] of rows){if(!v)continue;const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd)}if(item.claimUrl){const p=document.createElement('p');const link=document.createElement('a');link.href=item.claimUrl;link.target='_blank';link.rel='noopener';link.textContent='打开资料页';p.append(link);a.append(p)}for(const group of [item.pip,item.claimFiles])for(const file of group){const link=document.createElement('a');link.href=file.url;link.download=file.name;link.textContent='下载 '+file.name;link.style.display='inline-block';link.style.marginRight='12px';a.append(link)}return a}));if(skipped.length){const p=document.createElement('p');p.className='muted';p.textContent='因文件超过50MB，未上传：'+skipped.join('、');e.append(p)}}).catch(()=>{document.getElementById('app').textContent='资料加载失败'})</script></body></html>
