<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毛毛客户资料</title><style>
      :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292522;background:#f5f2ee}*{box-sizing:border-box}body{max-width:1080px;margin:0 auto;padding:28px 16px 48px}header{margin-bottom:22px}h1{margin:0;font-size:28px;letter-spacing:.02em}h2{margin:0;font-size:19px;line-height:1.35}.muted{color:#7b7169;font-size:14px}.material{background:#fff;border:1px solid #e4ddd5;border-radius:10px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #4a38200d}.material-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid #eee8e1;padding-bottom:14px}.material-id{color:#9b542f;font-size:12px;font-weight:600}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:16px 0}.detail{min-width:0}.label{display:block;color:#766960;font-size:12px;font-weight:700;margin-bottom:4px}.value{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}.section{border-top:1px solid #eee8e1;padding-top:15px;margin-top:15px}.section-title{font-size:14px;font-weight:700;margin-bottom:10px}.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.thumb-card{min-width:0}.thumb{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee8e1;border-radius:7px;border:1px solid #e2d9d0}.thumb-card a{display:block;color:#9b542f;font-size:12px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-list{display:flex;flex-wrap:wrap;gap:8px}.file-link{display:inline-flex;align-items:center;min-height:34px;padding:7px 10px;border:1px solid #dbcabe;border-radius:6px;color:#804322;text-decoration:none;background:#fffaf7;font-size:13px}.file-link:hover{background:#f8eee8}.source-note{color:#8a7e75;font-size:13px}.empty{padding:28px;background:#fff;border:1px dashed #d9cec4;border-radius:8px;text-align:center;color:#81766e}@media(max-width:640px){body{padding:20px 12px 32px}h1{font-size:24px}.material{padding:15px}.material-head{display:block}.material-id{display:block;margin-top:5px}.details{grid-template-columns:1fr}.thumb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    </style><body><header><h1>毛毛客户资料</h1><p class="muted">按文案整理发布资料。画中画可直接预览，领取文件可下载；参考成片仅显示名称。</p></header><main id="app"><p class="empty">正在加载…</p></main><script>
      fetch('data.json').then(r=>r.json()).then(({items,skipped})=>{const e=document.getElementById('app');if(!items.length){e.innerHTML='<p class="empty">暂时没有可分享的资料</p>';return}e.replaceChildren(...items.map((item,index)=>{const a=document.createElement('article');a.className='material';const head=document.createElement('div');head.className='material-head';const title=document.createElement('h2');title.textContent=item.name;const id=document.createElement('span');id.className='material-id';id.textContent='资料 '+String(index+1).padStart(2,'0');head.append(title,id);a.append(head);const details=document.createElement('div');details.className='details';const rows=[['参考成片',item.referenceVideo+'（仅本机参考，不提供视频下载）'],['视频上方标题',item.overlayTitle],['发布标题和话题',item.publishCopy],['领取说明',item.claimText]];for(const [label,value] of rows){if(!value)continue;const d=document.createElement('div');d.className='detail';const l=document.createElement('span');l.className='label';l.textContent=label;const v=document.createElement('div');v.className='value';v.textContent=value;d.append(l,v);details.append(d)}if(details.children.length)a.append(details);if(item.claimUrl){const p=document.createElement('p');const link=document.createElement('a');link.href=item.claimUrl;link.target='_blank';link.rel='noopener';link.textContent='打开领取页面';p.append(link);a.append(p)}if(item.pip?.length){const section=document.createElement('section');section.className='section';const heading=document.createElement('div');heading.className='section-title';heading.textContent='画中画素材（可预览）';const grid=document.createElement('div');grid.className='thumb-grid';for(const file of item.pip){const card=document.createElement('div');card.className='thumb-card';let preview;if(file.mediaType==='image'){preview=document.createElement('img');preview.loading='lazy';preview.alt=file.name}else{preview=document.createElement('video');preview.preload='metadata';preview.muted=true;preview.playsInline=true;preview.controls=true}preview.className='thumb';preview.src=file.url;const link=document.createElement('a');link.href=file.url;link.download=file.name;link.textContent=file.name;link.title=file.name;card.append(preview,link);grid.append(card)}section.append(heading,grid);a.append(section)}if(item.claimFiles?.length){const section=document.createElement('section');section.className='section';const heading=document.createElement('div');heading.className='section-title';heading.textContent='领取文件';const list=document.createElement('div');list.className='file-list';for(const file of item.claimFiles){const link=document.createElement('a');link.className='file-link';link.href=file.url;link.download=file.name;link.textContent='下载 '+file.name;link.title=file.name;list.append(link)}section.append(heading,list);a.append(section)}return a}));if(skipped?.length){const p=document.createElement('p');p.className='muted';p.textContent='因文件超过50MB，未上传：'+skipped.join('、');e.append(p)}}).catch(()=>{document.getElementById('app').innerHTML='<p class="empty">资料加载失败，请稍后刷新</p>'})
    </script></body></html>
