<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毛毛客户资料</title><style>
      :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292522;background:#f5f2ee}*{box-sizing:border-box}body{max-width:1080px;margin:0 auto;padding:28px 16px 48px}header{margin-bottom:22px}h1{margin:0;font-size:28px;letter-spacing:.02em}h2{margin:0;font-size:19px;line-height:1.35}.muted{color:#7b7169;font-size:14px}.update-time{margin:6px 0 0}.share-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px 16px;margin:20px 0 8px}.search-field{display:grid;gap:7px}.search-field label{font-size:13px;font-weight:700;color:#5f554e}.search-field input{width:100%;min-height:44px;border:1px solid #d7cbc1;border-radius:9px;background:#fff;padding:10px 13px;font:inherit;color:inherit;outline:none}.search-field input:focus{border-color:#a9633c;box-shadow:0 0 0 3px #a9633c1f}.search-count{margin:0 0 11px;white-space:nowrap}.material{background:#fff;border:1px solid #e4ddd5;border-radius:10px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #4a38200d}.material-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid #eee8e1;padding-bottom:14px}.material-id{color:#9b542f;font-size:12px;font-weight:600}.reference{margin:10px 0 16px}.reference video{display:block;width:100%;max-width:480px;max-height:480px;background:#181818;border-radius:8px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:16px 0}.detail{min-width:0}.detail-wide{grid-column:1/-1;border-top:1px solid #eee8e1;padding-top:14px}.label{display:block;color:#766960;font-size:12px;font-weight:700;margin-bottom:4px}.value{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}.section{border-top:1px solid #eee8e1;padding-top:15px;margin-top:15px}.section-title{font-size:14px;font-weight:700;margin-bottom:10px}.file-list{display:flex;flex-wrap:wrap;gap:8px}.file-link{display:inline-flex;align-items:center;min-height:38px;padding:8px 12px;border:1px solid #dbcabe;border-radius:7px;color:#804322;text-decoration:none;background:#fffaf7;font-size:13px;font-weight:600}.file-link:hover{background:#f8eee8}.empty{padding:28px;background:#fff;border:1px dashed #d9cec4;border-radius:8px;text-align:center;color:#81766e}@media(max-width:640px){body{padding:20px 12px 32px}h1{font-size:24px}.share-tools{grid-template-columns:1fr}.search-count{margin:0}.material{padding:15px}.material-head{display:block}.material-id{display:block;margin-top:5px}.details{grid-template-columns:1fr}}
    </style><body><header><h1>毛毛客户资料</h1><p class="muted">按文案整理发布资料。参考成片可直接播放，画中画和领取文件可下载。</p><p class="muted update-time" id="page-updated" hidden></p><div class="share-tools"><div class="search-field"><label for="share-search">搜索资料</label><input id="share-search" type="search" autocomplete="off" placeholder="搜索标题、正文、话题或领取说明"></div><p class="muted search-count" id="share-search-count" role="status" aria-live="polite"></p></div></header><main id="app"><p class="empty">正在加载…</p></main><script>
      const normalizeShareSearch=(value) => String(value ?? "").normalize("NFKC").toLocaleLowerCase("zh-CN").trim();
      const shareSearchText=(item) => normalizeShareSearch([
  item?.title, item?.overlayTitle, item?.publishCopy, item?.scriptText, item?.claimText,
  ...(item?.pip || []).map((file) => file.name), ...(item?.claimFiles || []).map((file) => file.name),
].filter(Boolean).join("\n"));
      const matchesShareSearch=(item, query) => normalizeShareSearch(query).split(/\s+/u).filter(Boolean).every((token) => shareSearchText(item).includes(token));
      const section=(title)=>{const s=document.createElement('section');s.className='section';const h=document.createElement('div');h.className='section-title';h.textContent=title;s.append(h);return s};
      const downloadList=(files,label)=>{const list=document.createElement('div');list.className='file-list';files.forEach((file,index)=>{const link=document.createElement('a');link.className='file-link';link.href=file.downloadUrl||file.url;link.download=file.name;link.textContent=files.length===1?label:label+' '+(index+1);link.title=file.name;list.append(link)});return list};
      fetch('data.json').then(r=>r.json()).then((payload)=>{const items=Array.isArray(payload.items)?payload.items:[],skipped=Array.isArray(payload.skipped)?payload.skipped:[],e=document.getElementById('app'),input=document.getElementById('share-search'),count=document.getElementById('share-search-count'),updated=document.getElementById('page-updated'),parsed=new Date(payload.generatedAt);if(Number.isFinite(parsed.getTime())){updated.hidden=false;updated.textContent='最近更新：'+new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(parsed)}const render=()=>{const query=input.value,visible=items.filter(item=>matchesShareSearch(item,query));count.textContent=query.trim()?'找到 '+visible.length+' 条资料':'共 '+items.length+' 条资料';if(!visible.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=items.length?'没有找到相关资料':'暂时没有可分享的资料';e.replaceChildren(empty);return}e.replaceChildren(...visible.map((item,index)=>{const a=document.createElement('article');a.className='material';const head=document.createElement('div');head.className='material-head';const title=document.createElement('h2');title.textContent=item.title||'客户资料';const id=document.createElement('span');id.className='material-id';id.textContent='资料 '+String(index+1).padStart(2,'0');head.append(title,id);a.append(head);const refSection=section('成片参考');const ref=document.createElement('div');ref.className='reference';if(item.referencePreview){const video=document.createElement('video');video.src=item.referencePreview;video.controls=true;video.preload='metadata';video.playsInline=true;ref.append(video)}else{const unavailable=document.createElement('div');unavailable.className='muted';unavailable.textContent='成片暂不可播放';ref.append(unavailable)}refSection.append(ref);a.append(refSection);const details=document.createElement('div');details.className='details';const rows=[['视频上方标题',item.overlayTitle],['发布标题和话题',item.publishCopy],['文案正文',item.scriptText,true],['领取说明',item.claimText]];for(const [label,value,wide] of rows){if(!value)continue;const d=document.createElement('div');d.className=wide?'detail detail-wide':'detail';const l=document.createElement('span');l.className='label';l.textContent=label;const v=document.createElement('div');v.className='value';v.textContent=value;d.append(l,v);details.append(d)}if(details.children.length)a.append(details);if(item.claimUrl){const s=section('领取页面');const link=document.createElement('a');link.className='file-link';link.href=item.claimUrl;link.target='_blank';link.rel='noopener';link.textContent='打开领取页面';s.append(link);a.append(s)}if(item.pip?.length){const s=section('画中画素材');s.append(downloadList(item.pip,'下载画中画素材'));a.append(s)}if(item.claimFiles?.length){const s=section('领取文件');s.append(downloadList(item.claimFiles,'下载领取文件'));a.append(s)}return a}));if(skipped.length){const p=document.createElement('p');p.className='muted';p.textContent='部分文件未上传：'+skipped.join('、');e.append(p)}};input.addEventListener('input',render);render()}).catch(()=>{document.getElementById('app').innerHTML='<p class="empty">资料加载失败，请稍后刷新</p>'})
    </script></body></html>
